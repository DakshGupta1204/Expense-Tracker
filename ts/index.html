<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="../vanilla/css/styles.css"/>
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
    </header>
    <main class="container">
        <section class="balance">
            <h2>Your Balance</h2>
            <h3 id="balance">₹0.00</h3>
        </section>

        <section class="summary">
            <div>
                <h4>Income</h4>
                <p id="income" class="money plus">₹0.00</p>
            </div>
            <div>
                <h4>Expense</h4>
                <p id="expense" class="money minus">₹0.00</p>
            </div>
        </section>
        <section>
            <h3>History</h3>
            <ul id="transaction-list" class="list">

            </ul>
        </section>
        <section>
            <h3>Add new Transaction</h3>
            <form id="form">
                <div class="form-control">
                    <label for="text">Description</label>
                    <input type="text" id="text" placeholder="Enter description..." />
                </div>
                <div class="form-control">
                    <label for="amount">
                        Amount<br/>
                        (negative - expense, positive - income)
                    </label>
                    <input type="number" id="amount" placeholder="Enter the amount"/>
                </div>
                <button>Add Transaction</button>
            </form>
        </section>
    </main>
    <script src="./src/app.js"></script>
</body>
</html>
